plugins { id 'com.android.application' }

android {
    namespace 'hu.treadmillprogrammer'
    compileSdk 36

    defaultConfig {
        applicationId 'hu.treadmillprogrammer'
        minSdk 36
        targetSdk 36
        versionCode 8
        versionName '0.8'
    }
    signingConfigs {
        debug {
            storeFile file('../gradle/poc-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
